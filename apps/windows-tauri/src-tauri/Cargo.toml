[package]
name = "teleport-windows"
version = "0.2.0-alpha.3"
edition = "2021"
[lib]
name = "teleport_windows"
path = "src/lib.rs"
[[bin]]
name = "teleport-windows"
path = "src/main.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crypto_box = { version = "0.9.1", features = ["std", "salsa20"] }
crypto_secretbox = "0.1.1"
salsa20 = "0.10.2"
curve25519-dalek = "4"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
